seed: 42
run:
  name: mechanical_k2
  output_dir: runs
  tensorboard: true
  resume: null
  trust_checkpoint: false

data:
  data_dir: data/mechanical_k2_npz
  filters: null
  kind: mechanical
  num_sources: 2
  sample_rate: 2000
  duration: 1.0
  train: 3400
  val: 200
  test: 400
  seed: 42
  filter_length: 13
  filter_model: exponential
  train_snr: [1.0, 4.0]
  eval_snr: [1.0, 2.0]
  fft_norm: ortho
  cache_fft: true
  compressed: true
  batch_size: 4
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  drop_last: false
  train_subset: null

sde:
  alpha: 3.0
  beta: 3.0
  sigma_min: 0.2
  sigma_max: 5.0
  steps: 512                 # covariance quadrature, NOT sampler NFE
  T: 1.0
  N: 1000                    # retained legacy SDE discretization default
  drift_mode: mixing         # mixing | none | instantaneous

network:
  architecture: enhanced     # enhanced | basic (both fixed time embedding)
  base_channels: 64
  time_dim: 256
  num_heads: 4
  dropout: 0.05

model:
  learning_rate: 0.0001
  weight_decay: 0.0001
  t_eps: 0.005
  time_sampling_strategy: uniform  # uniform | log_uniform | mixed
  time_sampling_log_fraction: 0.5
  ema_decay: 0.999
  mismatch_probability: 0.0
  mismatch_input: terminal         # terminal | forward_legacy (see CHANGELOG)
  mismatch_selection: batch        # matches last shared module; per_sample optional
  validation_seed: 11001

trainer:
  accelerator: auto
  devices: 1
  precision: 32-true
  max_epochs: 100
  max_steps: -1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  deterministic: true
  benchmark: false
  early_stopping_patience: 0        # disabled for equal-budget ablations
  save_top_k: 1
  fast_dev_run: false
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  overfit_batches: 0.0
  num_sanity_val_steps: 2

sampling:
  solver: euler
  num_steps: 50
  add_terminal_noise: true
  corrector_steps: 1
  corrector_snr: 0.16
  corrector_geometry: diffusion     # diffusion (B B^H) | identity
  corrector_step_size: null         # null = adaptive SNR heuristic
  corrector_max_step: 1.0           # explicit safety cap; null disables it
  weights: ema
  seed: 11001

evaluation:
  split: test
  batch_size: 4
  max_examples: null
  save_estimates: true
  output_dir: results
  failure_threshold: 5.0
  trust_checkpoint: false
