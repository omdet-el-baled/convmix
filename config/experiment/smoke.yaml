# @package _global_
defaults:
- override /logger: csv
run:
  name: smoke
data:
  data_dir: data/smoke_hydra
  train: 8
  val: 4
  test: 4
  duration: 0.032
  filter_length: 5
  batch_size: 2
model:
  score_model:
    base_channels: 8
    time_dim: 16
    num_heads: 2
    dropout: 0.0
  sde:
    steps: 32
  sampler:
    num_steps: 2
trainer:
  accelerator: cpu
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 1
evaluation:
  batch_size: 2
  max_examples: 4
