# @package _global_
defaults:
  - override /separator/network: convtasnet_tiny
  - _self_
run:
  name: convtasnet_smoke
trainer:
  max_epochs: 1
  check_val_every_n_epoch: 1
  limit_train_batches: 2
  limit_val_batches: 1
  log_every_n_steps: 1
data:
  batch_size: 2
  num_workers: 0
  persistent_workers: false
callbacks:
  early_stopping: null
