[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convmix-research"
version = "0.2.0"
description = "Config-driven version of the ConvMixSDE source-separation research scripts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "pytorch-lightning>=2.2,<3", "PyYAML>=6", "matplotlib>=3.7", "tensorboard>=2.14", "scipy>=1.10", "hydra-core>=1.3.2,<1.4", "omegaconf>=2.3,<2.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: short Lightning/checkpoint round-trip", "slow: statistical tests"]
